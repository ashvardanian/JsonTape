name: Release

on:
  release:
    types: [published]
  pull_request:
    branches: ["main", "main-dev"]

permissions:
  contents: read

jobs:
  hooks:
    name: Check Release Commit
    runs-on: ubuntu-26.04
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check the Release Commit
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME"

  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Nightly until Rust 1.100 ships on 2026-11-12; then switch all three to @stable and add an @1.100 MSRV job.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt, miri, rust-src
          targets: thumbv7em-none-eabihf
      - name: Format
        run: cargo fmt --check
      - name: Test feature permutations
        run: |
          for features in \
            "" \
            "--no-default-features" \
            "--features serde" \
            "--no-default-features --features serde"; do
            echo "::group::cargo test --locked $features"
            cargo test --locked $features
            echo "::endgroup::"
          done
      - name: Build for a `no_std` target
        run: |
          for features in "--no-default-features" "--no-default-features --features serde"; do
            echo "::group::cargo build --target thumbv7em-none-eabihf $features"
            cargo build --locked --lib --target thumbv7em-none-eabihf $features
            echo "::endgroup::"
          done
      - name: Test docs
        run: cargo test --locked --doc
      - name: Check documentation
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test the Slot casts under Miri
        run: cargo miri test --locked --lib slot
      - name: Compile benches
        run: cargo bench --locked --no-run

  fuzz:
    name: Fuzz
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Fuzz the parser
        run: cargo run --locked --release --example fuzz -- 200000 512 "$(printf '%x' ${{ github.run_id }})"

  publish_rust:
    name: Publish to crates.io
    runs-on: ubuntu-26.04
    needs: [hooks, test, fuzz]
    if: github.event_name == 'release'
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Authenticate with crates.io
        id: crates_io
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io.outputs.token }}
