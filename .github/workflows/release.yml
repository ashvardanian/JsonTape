name: Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  packages: write

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            Cargo.toml:^version = "(\d+\.\d+\.\d+)"
            Cargo.lock:name = "jsontape"\nversion = "(\d+\.\d+\.\d+)"
          dry-run: "false"
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf
      - name: Format
        run: cargo fmt --check
      - name: Test feature permutations
        run: |
          for features in \
            "" \
            "--no-default-features" \
            "--features serde" \
            "--no-default-features --features serde"; do
            echo "::group::cargo test --locked $features"
            cargo test --locked $features
            echo "::endgroup::"
          done
      - name: Build for a `no_std` target
        run: |
          for features in "--no-default-features" "--no-default-features --features serde"; do
            echo "::group::cargo build --target thumbv7em-none-eabihf $features"
            cargo build --locked --lib --target thumbv7em-none-eabihf $features
            echo "::endgroup::"
          done
      - name: Test docs
        run: cargo test --locked --doc
      - name: Check documentation
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Compile benches
        run: cargo bench --locked --no-run

  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Fuzz the parser
        run: cargo run --locked --release --example fuzz -- 200000 512 "$(printf '%x' ${{ github.run_id }})"

  publish_rust:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    needs: [versioning, test, fuzz]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: "main"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
