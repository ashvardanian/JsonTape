[package]
name = "jsontape"
version = "0.1.4"
edition = "2021"
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
description = "A minimalistic allocator-aware, zero-copy JSON & JSON5 parser in pure Rust"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ashvardanian/JsonTape"
documentation = "https://docs.rs/jsontape"
homepage = "https://github.com/ashvardanian/JsonTape"
# 1.100 is the floor: `core::alloc::Allocator` and allocator-generic `Vec` and `Box`
# stabilized there.
rust-version = "1.100"
keywords = ["json", "json5", "parser", "no-std", "zero-copy"]
categories = ["parser-implementations", "no-std", "encoding"]
# `scripts/` holds the benchmark and fuzz harnesses, which are dev-only; the
# published crate is the single library file.
exclude = [".github/", "data/"]

[lib]
path = "jsontape.rs"

# Without this, docs.rs builds only the default `std` feature and the entire
# `serde` API would be missing from the published documentation.
[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1.0.229", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.5.1"
json5 = "0.4.1"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
# float_roundtrip parses floats at full precision, a fair match for JsonTape's
# lossless numbers when benchmarking.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# The SIMD peer benchmarked against; never referenced by the library.
simd-json = "0.14.3"

[[bench]]
name = "bench"
path = "scripts/bench.rs"
harness = false

# The parser stress harness. An example rather than a `cargo-fuzz` target so the
# repository keeps a flat layout and no extra crate, and an example rather than a
# binary because only examples get `dev-dependencies` — which is what lets the
# harness cross-check against `serde_json`. Run it with
# `cargo run --release --example fuzz -- <cases> <max-length> [hex-seed]`.
[[example]]
name = "fuzz"
path = "scripts/fuzz.rs"

[features]
default = ["std"]
std = ["serde?/std"]
serde = ["dep:serde", "serde/alloc"]
