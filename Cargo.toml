[package]
name = "jsontape"
version = "0.1.0"
edition = "2021"
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
description = "A minimalistic allocator-aware, zero-copy JSON & JSON5 parser in pure Rust"
license = "Apache-2.0"
keywords = ["json", "parser", "no-std", "allocator", "zero-copy"]
categories = ["parser-implementations", "no-std"]

[lib]
path = "jsontape.rs"

[dependencies]
allocator-api2 = { version = "0.4", default-features = false, features = [
    "alloc",
] }
serde = { version = "1", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.5"
json5 = "0.4"
serde = { version = "1", default-features = false, features = ["derive"] }
# float_roundtrip parses floats at full precision, a fair match for JsonTape's
# lossless numbers when benchmarking.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The SIMD peer benchmarked against; never referenced by the library.
simd-json = "0.14"

[[bench]]
name = "bench"
path = "scripts/bench.rs"
harness = false

[features]
default = ["std"]
std = ["allocator-api2/std", "serde?/std"]
serde = ["dep:serde", "serde/alloc"]
